<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"EB Garamond";src:url("./fonts/EBGaramond-VF.ttf");font-weight:400 800}
@font-face{font-family:"EB Garamond";src:url("./fonts/EBGaramond-Italic-VF.ttf");font-weight:400 800;font-style:italic}
@font-face{font-family:"Inter";src:url("./fonts/Inter-VF.ttf");font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;background:#f7f3ec}
body{position:relative;overflow:hidden;font-family:"Inter",sans-serif;color:#1a2128}
.bar{position:absolute;left:0;top:0;bottom:0;width:14px;background:#2c3e4a}
.wrap{position:absolute;left:86px;right:80px;top:64px;bottom:60px;display:flex;flex-direction:column}
.eyebrow{font-size:21px;letter-spacing:.16em;text-transform:uppercase;color:#5b6b76;font-weight:500}
h1{font-family:"EB Garamond",serif;font-weight:500;font-size:96px;line-height:1.02;color:#2c3e4a;margin-top:34px;letter-spacing:-.01em}
h1 em{color:#a98748}
.sub{font-size:31px;line-height:1.4;color:#54595e;margin-top:30px;max-width:900px}
.foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
.stat{display:flex;align-items:baseline;gap:18px}
.stat b{font-family:"EB Garamond",serif;font-weight:500;font-size:84px;color:#2c3e4a;line-height:1}
.stat span{font-size:23px;color:#54595e;max-width:360px;line-height:1.3}
.url{font-size:26px;font-weight:600;color:#2c3e4a;border-bottom:3px solid #c9a86a;padding-bottom:4px}
.mark{position:absolute;right:80px;top:60px;width:56px;height:56px;border-radius:10px;background:#2c3e4a;color:#f7f3ec;font-family:"EB Garamond",serif;font-size:40px;text-align:center;line-height:56px}
</style></head>
<body>
<div class="bar"></div><div class="mark">W</div>
<div class="wrap">
  <div class="eyebrow">Scriptura &middot; Wroot Press</div>
  <h1>What the Latin Fathers<br><em>quoted</em></h1>
  <p class="sub">The Bible in Migne’s Patrologia Latina, counted: each age’s verses, the four senses, and what only a reader finds.</p>
  <div class="foot">
    <div class="stat"><b>399,679</b><span>scripture citations in Migne’s Latin Fathers, keyed to the verse</span></div>
    <div class="url">scriptura.wrootpress.com</div>
  </div>
</div>
</body></html>
